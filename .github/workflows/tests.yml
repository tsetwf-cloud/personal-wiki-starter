name: starter-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run standard-library tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 -m unittest discover -s tests -v
      - name: Validate shipped template
        run: python3 scripts/wiki_tool.py check --root templates/wiki
