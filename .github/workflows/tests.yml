name: personal-wiki-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test current package and preserved root tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 -B -m unittest discover -s tests -v
      - name: Check preserved legacy template
        run: python3 legacy/scripts/wiki_tool.py check --root legacy/templates/wiki
